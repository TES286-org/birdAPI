[project]
name = "bird-api"
version = "0.1.0"
description = "Python library for interacting with BIRD Internet Routing Daemon via Unix socket"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "TES286-bot", email = "bot@tes286.top" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bird_api"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/e2e"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# TID252 disabled: relative imports within a package are idiomatic Python.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["TID252"]

[tool.mypy]
python_version = "3.13"
strict = true
